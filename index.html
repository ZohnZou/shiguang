  --hei:'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e3dfd2;color:var(--ink);font-family:var(--hei);line-height:1.75;font-size:15px}
.page{max-width:760px;margin:32px auto;background:var(--paper);box-shadow:0 4px 40px rgba(0,0,0,.18);padding:0}
.page-head{border-bottom:3px double var(--ink);padding:28px 36px 20px;text-align:center;background:#fffdf7}
.page-head .kicker{font-size:11px;letter-spacing:.3em;color:var(--ink-3)}
.page-head h1{font-size:2.2em;font-weight:900;letter-spacing:.06em}
.page-head h1 .accent{color:var(--red)}
.page-head .sub{font-size:13px;color:var(--ink-2);margin-top:6px}
.head-band{background:var(--ink);color:#fff;text-align:center;padding:10px;font-weight:700;font-size:14px;letter-spacing:.1em}
.timeline{position:relative;padding:30px 36px 40px}
.timeline::before{content:"";position:absolute;left:60px;top:0;bottom:0;width:2px;background:var(--line)}
.item{position:relative;padding:0 0 26px 90px}
.item::before{content:"";position:absolute;left:53px;top:6px;width:16px;height:16px;background:var(--red);border-radius:50%;border:3px solid var(--paper)}
.item .date{font-size:12px;color:var(--red);font-weight:800;letter-spacing:.1em}
.item .title{font-size:1.15em;font-weight:900;margin:2px 0 4px}
.item .title a{color:var(--ink);text-decoration:none}
.item .title a:hover{color:var(--blue)}
.item .desc{font-size:13.5px;color:var(--ink-2)}
.item .tag{display:inline-block;background:#f2eee3;border:1px solid var(--line);font-size:11px;color:var(--ink-2);padding:1px 8px;border-radius:3px;margin-right:6px;margin-top:4px}
.footer{margin-top:8px;padding-top:12px;border-top:3px double var(--ink);font-size:11.5px;color:var(--ink-3);text-align:center}
.footer a{color:var(--blue)}
@media(max-width:720px){.page{margin:0}.page-body{padding:18px 16px}.timeline{padding:24px 20px 32px}.timeline::before{left:24px}.item{padding-left:48px}.item::before{left:17px}}
</style>
