<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光 · AI 视界｜往期索引</title>
<style>
:root{
  --paper:#faf7f0; --ink:#1a1a1a; --ink-2:#555; --ink-3:#8a8478;
  --line:#d8d2c4; --red:#c0392b; --blue:#1f5f8b;
  --hei:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','微软雅黑','Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:#e3dfd2;color:var(--ink);font-family:var(--hei);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
.page{max-width:760px;margin:32px auto;background:var(--paper);box-shadow:0 4px 40px rgba(0,0,0,.18);overflow:hidden}
.page-head{border-bottom:3px double var(--ink);padding:30px 36px 22px;text-align:center;background:#fffdf7}
.page-head .kicker{font-size:11px;letter-spacing:.3em;color:var(--ink-3)}
.page-head h1{font-size:clamp(1.8em, 8vw, 2.4em);font-weight:900;letter-spacing:.06em}
.page-head h1 .accent{color:var(--red)}
.page-head .sub{font-size:14px;color:var(--ink-2);margin-top:8px}
.back{display:inline-block;margin:14px 0 0;font-size:13px;color:var(--blue);text-decoration:none;font-weight:700}
.back:hover{text-decoration:underline}
.list{padding:24px 28px 32px}
.issue-card{display:block;text-decoration:none;color:inherit;border:2px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px;background:#fffdf7;transition:all .18s ease;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.issue-card:hover{border-color:var(--red);box-shadow:0 6px 20px rgba(192,57,43,.15);transform:translateY(-2px)}
.issue-card .issue-date{font-size:12px;color:var(--red);font-weight:800;letter-spacing:.08em}
.issue-card .issue-title{font-size:1.3em;font-weight:900;margin:6px 0 6px;color:var(--ink)}
.issue-card .issue-desc{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.issue-card .issue-tags{margin-top:12px}
.issue-card .tag{display:inline-block;background:#f2eee3;border:1px solid var(--line);font-size:11px;color:var(--ink-2);padding:2px 9px;border-radius:3px;margin-right:6px;margin-bottom:4px}
.issue-card .read-more{display:inline-block;margin-top:14px;background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:8px 18px;border-radius:6px;letter-spacing:.05em}
.issue-card:hover .read-more{background:var(--ink)}
.footer{margin-top:8px;padding:14px 20px;border-top:3px double var(--ink);font-size:12px;color:var(--ink-3);text-align:center}
.footer a{color:var(--blue);font-weight:700;text-decoration:none;border-bottom:1px solid var(--blue)}
@media(max-width:720px){
  .page{margin:0;min-height:100vh}
  .page-head{padding:22px 16px 16px}
  .list{padding:18px 14px 24px}
  .issue-card{padding:16px 16px}
  .issue-card .issue-title{font-size:1.15em}
}
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <div class="kicker">拾光 · AI 视界 · 往期索引</div>
    <h1>拾光 <span class="accent">·</span> AI 视界</h1>
    <div class="sub">把 AI 捡起来，学明白 · 每期一份电子报纸</div>
    <a class="back" href="index.html">← 回今日报纸</a>
  </div>

  <div class="list">
    <a class="issue-card" href="2026-10-28_AI视界.html">
      <div class="issue-date">2026-10-28 · 第 1 期</div>
      <div class="issue-title">首刊：GPT-6.1 Terra 会自己操作电脑了</div>
      <div class="issue-desc">头条 GPT-6.1 Terra 发布；Genie 4 世界模型、Kimi K3.1 Pro、讯飞星火 X2.6 实测；海洋大模型备案、Anthropic IPO 深度解读。</div>
      <div class="issue-tags">
        <span class="tag">🔍 拾光分析</span>
        <span class="tag">📖 拾光词典 #001-002</span>
        <span class="tag">▶ 5 条视频</span>
      </div>
      <span class="read-more">📖 阅读本期 →</span>
    </a>
  </div>

  <div class="footer">拾光 · AI 视界 · 拾光主笔 · <a href="index.html">今日报纸</a></div>
</div>
</body>
</html>
